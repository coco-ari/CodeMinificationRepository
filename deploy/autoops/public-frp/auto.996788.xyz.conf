# 宝塔保留公网证书和域名管理，业务请求经独立 frp 隧道进入内网工作台。
map $http_upgrade $autoops_connection_upgrade {
    default upgrade;
    '' close;
}
limit_req_zone $binary_remote_addr zone=autoops_login:1m rate=10r/m;

server {
    listen 80;
    server_name auto.996788.xyz;
    root /www/wwwroot/auto.996788.xyz;
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 308 https://auto.996788.xyz$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name auto.996788.xyz;
    root /www/wwwroot/auto.996788.xyz;
    ssl_certificate /www/server/panel/vhost/cert/auto.996788.xyz/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/auto.996788.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:autoops_ssl:2m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=86400" always;
    client_max_body_size 50m;
    # 不把查询参数中的临时授权或文件正文写入代理访问日志。
    access_log off;
    error_log /www/wwwlogs/auto.996788.xyz.error.log crit;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $autoops_connection_upgrade;
    proxy_cookie_flags demo_session secure httponly samesite=strict;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_redirect off;
    proxy_connect_timeout 10s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    # 写请求结果未知时不自动换后端重发。
    proxy_next_upstream off;

    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    # frpc 主动建立经过证书校验的 WSS 连接，frps 只监听本机回环。
    location = /~!frp {
        proxy_pass http://127.0.0.1:17001;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }
    location = / { return 302 /agent-demo.html; }
    location = /api/agent-demo/login {
        limit_req zone=autoops_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:18081;
    }
    location / { proxy_pass http://127.0.0.1:18081; }
}
