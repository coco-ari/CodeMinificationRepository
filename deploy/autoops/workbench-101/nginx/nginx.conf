worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # 不记录查询参数，避免客户接入凭据进入访问日志。
    log_format minimal '$remote_addr $request_method $uri $status $body_bytes_sent';
    access_log /dev/stdout minimal;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    client_max_body_size 0;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream autoops_gateway {
        zone autoops_gateway 64k;
        # 网关重建后重新解析容器地址，避免代理继续访问旧地址。
        resolver 127.0.0.11 valid=10s ipv6=off;
        server gateway:8787 resolve;
    }

    server {
        listen 8080;
        listen 8443 ssl;
        ssl_certificate /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        server_name autops.abroad.besiter.com.cn;
        absolute_redirect off;

        location = /autoops-internal-ca.crt {
            alias /etc/nginx/tls/ca.crt;
            default_type application/x-x509-ca-cert;
        }

        location = / {
            return 302 /agent-demo.html;
        }

        location / {
            proxy_pass http://autoops_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
