name: AutoOps 质量检查
on:
  # 开发测试阶段不自动运行；正式上线前可手动执行完整检查。
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 验证公网证书维护
        run: python3 -m unittest discover -s test -p test_public_certificate.py -v
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm verify:autoops
