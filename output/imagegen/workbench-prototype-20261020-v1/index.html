<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>项目工作台 · 原型图集</title>
<style>
:root{color-scheme:light;font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#282a32;background:#edf0f4}
*{box-sizing:border-box}body{margin:0}header{max-width:1640px;margin:0 auto;padding:28px 28px 18px}h1{font-size:24px;letter-spacing:-.6px;margin:0 0 8px}p{margin:0;color:#616875;font-size:14px;line-height:1.7}
nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}button,.download{font:inherit;font-size:14px;padding:10px 16px;border:1px solid #d5d9e0;border-radius:10px;background:#ffffffb8;color:#373c46;text-decoration:none;cursor:pointer;box-shadow:inset 0 1px 0 #fff,0 2px 4px #232c4310}
button[aria-selected=true]{background:#292b34;color:white;border-color:#292b34}button:focus-visible,a:focus-visible{outline:3px solid #69789f;outline-offset:3px}
main{max-width:1640px;margin:0 auto;padding:0 20px 32px}figure{margin:0}img{display:block;width:100%;height:auto;border:1px solid #dde1e9;border-radius:16px;box-shadow:0 12px 36px #39425916;background:#fff}
figcaption{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:16px 8px;font-size:14px;color:#626978}.label{font-weight:600;color:#303642}
footer{font-size:12px;color:#707782;padding:0 8px;line-height:1.7}footer a{color:inherit}
@media(max-width:640px){header{padding:20px 16px 16px}main{padding:0 8px 24px}h1{font-size:21px}nav{gap:6px}button{padding:9px 11px}figcaption{align-items:flex-start}img{border-radius:10px}}
</style></head>
<body>
<header><h1>项目工作台 · 首版原型</h1><p>SOL 标准版 · 浅色 Solid Glass · 四张静态高保真界面，展示统一配置、可复用产物与 Agent 交互。</p>
<nav role="tablist" aria-label="选择原型页面"><button id="tab-0" role="tab" aria-controls="prototype-panel" aria-selected="true" tabindex="0" data-index="0">01 项目概览</button><button id="tab-1" role="tab" aria-controls="prototype-panel" aria-selected="false" tabindex="-1" data-index="1">02 资料与插件配置</button><button id="tab-2" role="tab" aria-controls="prototype-panel" aria-selected="false" tabindex="-1" data-index="2">03 源码与处理产物</button><button id="tab-3" role="tab" aria-controls="prototype-panel" aria-selected="false" tabindex="-1" data-index="3">04 Agent 对话</button></nav></header>
<main><section id="prototype-panel" role="tabpanel" aria-labelledby="tab-0"><figure><img id="screen" src="01-project-overview.png" alt="项目概览静态原型图"><figcaption><span><span class="label" id="screen-title">项目概览</span> · 示例数据</span><a class="download" id="download" href="01-project-overview.png" download>下载 PNG</a></figcaption></figure></section>
<footer>这是静态原型图集，图中的业务控件仅用于说明设计。<br>使用 imagegen 内置工具生成 · <a href="generation-prompts.json">查看生成提示词</a></footer></main>
<script>
const screens=[{"title":"项目概览","file":"01-project-overview.png"},{"title":"资料与插件配置","file":"02-materials-plugin-config.png"},{"title":"源码与处理产物","file":"03-source-artifacts.png"},{"title":"Agent 对话","file":"04-agent-conversation.png"}];
const tabs=[...document.querySelectorAll('[role="tab"]')];
function select(index,focus=false){tabs.forEach((tab,i)=>{tab.setAttribute("aria-selected",String(i===index));tab.tabIndex=i===index?0:-1});const item=screens[index];document.getElementById("screen").src=item.file;document.getElementById("screen").alt=item.title+"静态原型图";document.getElementById("screen-title").textContent=item.title;document.getElementById("download").href=item.file;document.getElementById("prototype-panel").setAttribute("aria-labelledby","tab-"+index);if(focus)tabs[index].focus();}
tabs.forEach((tab,index)=>{tab.addEventListener("click",()=>select(index));tab.addEventListener("keydown",event=>{let next=index;if(event.key==="ArrowRight")next=(index+1)%tabs.length;else if(event.key==="ArrowLeft")next=(index+tabs.length-1)%tabs.length;else if(event.key==="Home")next=0;else if(event.key==="End")next=tabs.length-1;else return;event.preventDefault();select(next,true);});});
</script></body></html>
